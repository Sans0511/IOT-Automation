<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 280 260" width="280" height="260" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Rain detection device icon</title>
  <defs>
    <path id="drop" d="M0 -11 C6 -3 9 1 9 6 A9 9 0 0 1 -9 6 C-9 1 -6 -3 0 -11 Z"/>
  </defs>
  <!-- ground -->
  <ellipse cx="140" cy="244" rx="86" ry="9" fill="#C9B38A"/>
  <!-- cloud -->
  <g fill="#9FB4C7">
    <circle cx="106" cy="52" r="26"/>
    <circle cx="146" cy="40" r="32"/>
    <circle cx="182" cy="56" r="24"/>
    <rect x="84" y="52" width="120" height="26" rx="13"/>
  </g>
  <rect x="100" y="34" width="60" height="12" rx="6" fill="#B9CADA" opacity="0.7"/>
  <!-- rain drops -->
  <g fill="#3FA7E0">
    <use xlink:href="#drop" transform="translate(104 100)"/>
    <use xlink:href="#drop" transform="translate(140 108)"/>
    <use xlink:href="#drop" transform="translate(176 100)"/>
  </g>
  <!-- mounting pole -->
  <rect x="132" y="196" width="16" height="48" fill="#6F8397"/>
  <rect x="116" y="238" width="48" height="8" rx="3" fill="#4A5560"/>
  <!-- sensor plate -->
  <rect x="64" y="128" width="152" height="72" rx="8" fill="#1F5F3A"/>
  <rect x="64" y="128" width="152" height="72" rx="8" fill="none" stroke="#17482C" stroke-width="3"/>
  <path d="M80 142 H198 V156 H82 V170 H198 V184 H82" fill="none" stroke="#E0B84A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- small water beads on plate -->
  <g fill="#6CC1EE" opacity="0.9">
    <circle cx="112" cy="163" r="4"/>
    <circle cx="156" cy="149" r="4"/>
    <circle cx="178" cy="177" r="4"/>
  </g>
  <!-- control module -->
  <rect x="176" y="208" width="72" height="32" rx="6" fill="#2B3A4A"/>
  <circle cx="192" cy="224" r="5" fill="#43D17A"/>
  <rect x="206" y="218" width="30" height="12" rx="3" fill="#41566B"/>
  <!-- wire from plate to module -->
  <path d="M148 200 V214 Q148 224 160 224 H176" fill="none" stroke="#D64545" stroke-width="4" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
