<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 260" width="280" height="260" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Motor pump icon</title>
  <!-- base plate -->
  <rect x="30" y="214" width="220" height="16" rx="4" fill="#4A5560"/>
  <rect x="48" y="200" width="24" height="16" fill="#6F7B87"/>
  <rect x="208" y="200" width="24" height="16" fill="#6F7B87"/>
  <!-- inlet pipe (left) -->
  <rect x="14" y="150" width="62" height="34" fill="#8FA3B5"/>
  <rect x="64" y="142" width="14" height="50" rx="3" fill="#6F8397"/>
