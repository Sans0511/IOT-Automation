  <circle cx="150" cy="168" r="22" fill="#1F5F96"/>
  <circle cx="150" cy="168" r="9" fill="#9FB4C7"/>
  <!-- motor body -->
  <rect x="190" y="130" width="62" height="76" rx="10" fill="#E0A82E"/>
  <path d="M202 130 V206 M214 130 V206 M226 130 V206 M238 130 V206" stroke="#C48E1C" stroke-width="4"/>
  <!-- junction box and cable -->
  <rect x="206" y="112" width="30" height="20" rx="4" fill="#2B3A4A"/>
  <path d="M221 112 V96 H250" fill="none" stroke="#D64545" stroke-width="4" stroke-linecap="round"/>
  <circle cx="250" cy="96" r="4" fill="#D64545"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
